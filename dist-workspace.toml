[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): builds release archives in CI on a `v*` tag.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
# Archives only: no `curl | sh` installers. Users download, verify the
# checksum and the provenance attestation, then unpack.
installers = []
checksum = "sha256"
# GitHub build-provenance attestations for every artifact.
github-attestations = true
# Embed the dependency list in the binary (cargo-auditable) and attach a
# CycloneDX SBOM to the release.
cargo-auditable = true
cargo-cyclonedx = true
# Run the plan step on pull requests so release config errors show early.
pr-run-mode = "plan"
# Pin every action in release.yml to a commit, like the other workflows.
github-action-commits = { "actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333", "actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" }
# release.yml is edited after generation to give each job only the
# permissions it needs (see the comments in it).
allow-dirty = ["ci"]
